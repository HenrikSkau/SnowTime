<style>
:root{
  --bg:#ffffff;--card:#ffffff;--card2:#f1f7fd;--line:#e2ebf4;--txt:#13283d;--mut:#5b6d80;--dim:#9aabbd;
  --acc:#3a9ff0;--acc2:#e6f3fe;--accd:#1673c6;--live:#e5484d;
  --lr:#2bb673;--ss:#f39a3a;--al:#3a9ff0;--hp:#9a6cf0;--kb:#1fb3b8;--sc:#d6457e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#7cc4ff,#3a9ff0);overflow:hidden}
.logo svg{width:100%;height:100%;display:block}
.top h1 .snow{color:var(--accd)}
.top h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.2px;flex:1}
.top h1 small{display:block;font-size:11.5px;color:var(--mut);font-weight:500;letter-spacing:0}
.iconbtn{height:32px;padding:0 12px;border-radius:16px;background:var(--acc2);color:var(--accd);font-size:13px;font-weight:600}
.iconbtn.round{width:32px;padding:0;display:grid;place-items:center}
.days{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none;scroll-behavior:smooth}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:50px;height:74px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 7px;border-radius:12px;text-align:center;color:var(--mut);position:relative}
.day .wd{font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.day .dn{font-size:17px;font-weight:700;color:var(--txt)}
.day .mo{font-size:10px;color:var(--dim);height:12px;line-height:12px}
.day .dots{width:100%;display:flex;gap:2px;justify-content:center;height:5px;margin-top:2px}
.day .dots i{display:block;width:5px;height:5px;border-radius:50%}
.day.today .wd{color:var(--acc);font-weight:700}
.day.sel{background:transparent;box-shadow:inset 0 0 0 2px var(--acc)}
.day.sel .dn{color:var(--accd)}
.day.sel .wd{color:var(--accd);font-weight:700}
.day.nodata .dn{color:var(--dim)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:31px;padding:0 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--acc2);color:var(--accd);border-color:#9fd0f8}
.chip .sw{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;margin-left:-4px}
.chip .sw svg{width:13px;height:13px;color:#fff}
.sub{display:flex;gap:7px;padding:0 12px 10px;align-items:center}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:#fff}
select.sel{background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:10px;height:31px;padding:0 8px;font:inherit;font-size:12.5px;font-weight:600}
main{padding:12px}
.dayhead{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
.dayhead:first-child{margin-top:4px}
.card{background:var(--card);border-radius:14px;margin-bottom:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 3px rgba(19,40,61,.05)}
.ch{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#f7fbff}
.badge{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 auto}
.ch .t{flex:1;min-width:0}
.ch .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .t span{font-size:12px;color:var(--mut)}
.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--acc2);color:var(--accd);text-transform:uppercase;letter-spacing:.3px;margin-left:6px;vertical-align:1px}
.tag.vm{background:#fff1bf;color:#7a5800}
.tv{font-size:11.5px;font-weight:700;padding:3px 8px 3px 6px;border-radius:7px;border:1px solid var(--line);color:var(--txt);background:#f7f9fb;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tv svg{width:12px;height:12px;color:var(--mut)}
.badge svg{width:18px;height:18px}
.tv.unk{color:var(--dim);border-style:dashed}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--card2)}
.time{width:66px;flex:0 0 auto;text-align:center}
.time b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.time span{font-size:11px;color:var(--mut)}
.time .live{color:var(--live);font-weight:800;font-size:12px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.4}}
.row .d{flex:1;min-width:0}
.row .d b{font-weight:600;font-size:14px}
.row .d span{display:block;font-size:12px;color:var(--mut)}
.row .d span.g{display:inline;font-size:10.5px;color:#46586b}
.row.done{opacity:.55}
.g{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:#eef3f8;color:#46586b;margin-left:6px;vertical-align:1px}
.banner{padding:12px;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:12px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;margin-top:12px}
.btn.ghost{background:var(--acc2);color:var(--accd)}
.star{font-size:19px;color:var(--dim);padding:2px 4px;line-height:1}
.star.on{color:#f5b400}
.month{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
.month:first-child{margin-top:4px}
.stage{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage .open{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px}
.stage .open .t{flex:1;min-width:0}
.stage .open b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .open span{font-size:12px;color:var(--mut)}
.stage.past{opacity:.5}
.search{display:flex;align-items:center;gap:8px;margin:2px 12px 12px;padding:0 12px;height:42px;border-radius:12px;border:2px solid var(--acc);background:#fff}
.search svg{width:18px;height:18px;color:var(--mut);flex:0 0 auto}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;color:var(--txt);background:transparent;min-width:0}
.search button{font-size:13px;color:var(--mut);font-weight:600}
.hint{font-size:12.5px;color:var(--mut);padding:2px 4px 10px}
input[type=search]::-webkit-search-cancel-button{display:none}
mark{background:#d9eefe;color:inherit;border-radius:3px;padding:0 1px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 3px rgba(19,40,61,.05)}
.scard .badge{width:34px;height:34px;border-radius:10px;margin-bottom:6px}.scard .badge svg{width:22px;height:22px}
.scard b{font-size:15.5px}.scard span{font-size:12px;color:var(--mut)}.scard em{font-style:normal;font-size:11.5px;color:var(--accd);font-weight:600;margin-top:4px}
.backbar{margin:-2px 0 6px}.back{font-size:14px;font-weight:600;color:var(--accd);padding:6px 2px}
.shead{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}.shead h2{margin:0;font-size:21px}.shead .badge{width:40px;height:40px;border-radius:11px}.shead .badge svg{width:24px;height:24px}
.sercard{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(19,40,61,.05)}
.sertop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.sertop b{display:block;font-size:16px}.sertop span{font-size:12.5px;color:var(--mut)}
.chev{font-size:24px;color:var(--dim);line-height:1}.sermeta{font-size:12.5px;color:var(--txt);margin-top:8px}.serch{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pbar{height:6px;background:#edf2f7;border-radius:3px;margin-top:10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.ptxt{font-size:11.5px;color:var(--mut);margin-top:5px}
.seg.wide{display:flex;margin-bottom:12px}
.gseg button.on{background:var(--accd)}.seg.wide button{flex:1;padding:7px 10px;font-size:13.5px}
.donebox{margin-top:16px}.donebox summary{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:8px 4px;cursor:pointer}
main.sl{animation:sl .22s ease-out}main.sr{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(36px);opacity:.25}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-36px);opacity:.25}to{transform:none;opacity:1}}
main{touch-action:pan-y}
.slchip{font-style:normal;font-size:10px;font-weight:700;color:var(--accd);background:var(--acc2);padding:1px 6px;border-radius:5px}
.slctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.search.sm{margin:0 0 8px;height:38px;border-width:1px;border-color:var(--line)}
.card.sl{margin-top:4px}
.slr{display:grid;grid-template-columns:30px 62px minmax(0,1fr) 44px 48px;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.slr:last-child{border-bottom:0}
.slr .bib{font-weight:700;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.slr .st{font-variant-numeric:tabular-nums;color:var(--txt);font-size:12.5px}
.slr .st em{display:block;font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--live);border-radius:4px;padding:0 4px;width:max-content;margin-top:2px}
.slr .nm{min-width:0}.slr .nm b{display:block;font-weight:600;line-height:1.25}
.slr .nm small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slr .nat{text-align:center;line-height:1.1}.slr .nat small{display:block;font-size:10px;color:var(--mut)}
.slr .fis{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.slr.top{background:#eaf5ff;box-shadow:inset 3px 0 0 var(--acc)}
.slr.top .fis{color:var(--accd)}
.slr .rk{font-style:normal;font-size:10.5px;font-weight:800;color:#fff;background:var(--acc);border-radius:5px;padding:0 5px;margin-right:5px;vertical-align:1px}
.slr.out{opacity:.55}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .in{max-width:640px;margin:0 auto;display:flex}
nav.bottom button{flex:1;padding:9px 0 10px;font-size:11.5px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--accd)}
nav.bottom button.on svg{color:var(--acc)}
.sheetbg{position:fixed;inset:0;background:rgba(19,40,61,.35);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;border:1px solid var(--line);max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#d3dde8;margin:4px auto 14px}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .meta{color:var(--mut);font-size:13.5px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--line);font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:600}
.note{font-size:12.5px;color:var(--mut);background:#f4f9fe;border-left:3px solid var(--acc);padding:9px 11px;border-radius:8px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:20px 2px 8px}
.next{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 6px;padding:0 12px}
.next::-webkit-scrollbar{display:none}
.nx{flex:0 0 220px;background:linear-gradient(160deg,#eaf5ff,#fff);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left}
.nx .top2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.nx .top2 .loc{font-size:12px;color:var(--mut);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx b{display:block;font-size:14px}
.nx .when{font-size:12.5px;color:var(--accd);font-weight:700;margin-top:4px}
.small{font-size:12px;color:var(--dim);padding:6px 4px 20px;line-height:1.5}
.small a{color:var(--mut)}
a{color:var(--accd)}
.radio{font-size:10px;color:var(--dim);margin-top:3px;white-space:nowrap}
.radio .tvt{color:var(--accd);font-weight:700}
.kv{box-shadow:none}
</style>
</head>

<script>

/* ================= MODELL ================= */
const yr=md=>(+md.slice(0,2)>=7?2026:2027);
const iso=md=>yr(md)+'-'+md;
const ST={};
STAGES.forEach(s=>{ST[s[0]]={id:s[0],sp:s[1],v:s[2],cc:s[3],from:iso(s[4]),to:iso(s[5]),ch:s[6],tag:s[7]||'',note:s[8]||'',races:[]}});

/* ================= TILSTAND ================= */
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY=toISO(new Date());
const FIRST='2026-10-19',LAST='2027-04-04';
const clampDate=s=>s<FIRST?FIRST:s>LAST?LAST:s;
let S={v:'program',date:clampDate(TODAY),mode:'dag',sp:'all',g:'all',ch:'all',fav:{st:[],sp:[]},stSp:'all'};
try{const sv=JSON.parse(localStorage.getItem('vp-state')||'null');if(sv){S.fav=sv.fav||S.fav;S.sp=sv.sp||'all';S.g=sv.g||'all';S.ch=sv.ch||'all';S.mode=sv.mode||'dag'}}catch(e){}

/* ================= HJELPERE ================= */
const fmtDay=s=>{const t=parse(s).toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1)};
const fmtShort=s=>parse(s).toLocaleDateString('nb-NO',{day:'numeric',month:'short'}).replace('.','');
const range=(a,b)=>a===b?fmtShort(a):(a.slice(5,7)===b.slice(5,7)?parse(a).getDate()+'.–'+fmtShort(b):fmtShort(a)+' – '+fmtShort(b));
const chCls=c=>c==='NRK'?'NRK':c==='TV 2'?'TV2':c==='Viaplay'?'Viaplay':'unk';
const tvB=c=>`<span class="tv ${c==='?'?'unk':''}">${c==='?'?'':TVI}${c==='?'?'Kanal ikke oppgitt':c}</span>`;

const start=r=>{const d=parse(r.date);if(r.t){const[h,m]=r.t.split(':');d.setHours(+h,+m)}return d};
function status(r){
  const now=new Date();
  if(r.date<TODAY)return{k:'done'};
  if(r.date>TODAY)return{k:'up'};
  if(!r.t)return{k:'today'};
  const diff=(start(r)-now)/60000;
  if(diff>0)return{k:'soon',m:diff};
  if(diff>-100)return{k:'live'};
  return{k:'done'};
}
const inFilter=r=>(S.sp==='all'||r.sp===S.sp)&&(S.g==='all'||r.g===S.g||r.g==='B'||r.g==='X')&&(S.ch==='all'||r.ch.includes(S.ch));
const stInFilter=s=>(S.sp==='all'||s.sp===S.sp)&&(S.ch==='all'||s.ch.includes(S.ch));

/* ================= SØK ================= */
// Søkeindeksen er bygget som en liste med typer, slik at nye typer (f.eks. utøvere) kan legges til senere.
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/æ/g,'ae').replace(/ø/g,'o');
const ALIAS={'VM':'vm verdensmesterskap mesterskap','NM':'nm norgesmesterskap mesterskap','Tour de Ski':'tour de ski tds','Hoppuka':'hoppuka four hills','Finale':'finale verdenscupfinale grand finale','Grand Classics':'grand classics','Skiflyging':'skiflyging','Sesongstart':'sesongstart','Sesongåpning':'sesongapning sesongstart'};
function stageHay(s){
  const wc=s.sp==='sc'?'ski classics world championship langlop langrenn':['VM','EM','NM'].includes(s.tag)||s.note.startsWith('Nasjonale')?'':'verdenscup world cup';
  const mo=parse(s.from).toLocaleDateString('nb-NO',{month:'long'});
  return norm([s.v,cn(s.cc),SPORT[s.sp].n,s.tag,ALIAS[s.tag]||'',wc,s.ch,mo,s.sp==='hp'&&s.tag!=='VM'?'hopp':'',s.sp==='lr'?'ski':'',s.sp==='kb'?'kombinert nordisk':''].join(' '));
}

  stages:STL.map(s=>({type:'stage',item:s,hay:stageHay(s)})),

  if(!t.length)return null;
  const all=x=>t.every(w=>x.hay.includes(w));
  const st=INDEX.stages.filter(all).map(x=>x.item);
  const ra=INDEX.races.filter(x=>all(x)&&t.some(w=>x.own.includes(w))).map(x=>x.item);
  const up=ra.filter(r=>r.date>=TODAY),past=ra.filter(r=>r.date<TODAY);
  return {t,st,ra:[...up,...past].slice(0,40),nra:ra.length,ath:INDEX.athletes.filter(all)};
}
function hl(text,t){let s=text;t.forEach(w=>{if(w.length<2)return;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');s=s.replace(re,'<mark>$1</mark>')});return s}
function sok(){
  const res=search(S.q||'');const m=$('main');

  }
  if(res.ra.length){
    html+=`<div class="sec">Øvelser · ${res.nra}${res.nra>40?' (viser 40)':''}</div><div class="card">${res.ra.map(r=>raceRow(r,true).replace(`<b>${r.d}</b>`,`<b>${hl(r.d,res.t)}</b>`).replace(`<span>${fmtShort(r.date)} · ${SPORT[r.sp].n}</span>`,`<span>${fmtShort(r.date)} · ${r.st.v} · ${SPORT[r.sp].n}</span>`)).join('')}</div>`;
  }
  if(!html)html=`<div class="empty"><b>Ingen treff på «${S.q.replace(/</g,'&lt;')}»</b>Prøv et annet ord, for eksempel et stedsnavn eller «VM».</div>`;

}

function raceRow(r,showDate,showStage){
  const st=status(r);let tm;

  else if(st.k==='done')tm=`<b>${r.t||'–'}</b><span>Ferdig</span>`;
  else tm=`<b>${r.t||'–'}</b><span>${st.k==='soon'?countdown(st.m):(r.t?'start':'tid kommer')}</span>`;
  const when=(showDate?`${fmtShort(r.date)} · `:'')+(showStage?`${flag(r.st.cc)} ${r.st.v} · `:'');
  return `<button class="row ${st.k==='done'?'done':''}" data-r="${r.id}">
    <div class="time">${tm}</div>
    <div class="d"><b>${r.d}</b>${gH(r.g)}<span>${when}${SPORT[r.sp].n}${r.sl?' · <i class="slchip">Startliste</i>':''}</span></div>
    <div style="text-align:right">${tvB(r.ch)}<div class="radio">${r.tv?'<b class="tvt">TV fra '+r.tv+'</b>':''}${r.tv&&r.radio?' · ':''}${r.radio?'+ NRK radio':''}</div></div></button>`;
}
function stageCard(s,races,dayISO){
  const head=`<button class="ch" data-s="${s.id}">${badge(s.sp)}<div class="t"><b>${flag(s.cc)} ${s.v}${tagH(s.tag)}</b><span>${[SPORT[s.sp].n,cn(s.cc),range(s.from,s.to)].filter(Boolean).join(' · ')}</span></div>${s.ch.includes('/')?'':tvB(s.ch)}</button>`;
  if(races.length)return `<div class="card">${head}${races.map(r=>raceRow(r)).join('')}</div>`;
  const wk=s.note.startsWith('Uke');
  return `<div class="card">${head}<div class="banner">${wk?'📅 Renn denne uka. Eksakte dager er ikke lagt inn.':s.tag==='VM'?'🏆 Mesterskapet pågår. Dagsprogrammet er ikke lagt inn ennå.':'📅 Pågår. Detaljert program er ikke lagt inn.'}</div></div>`;
}
function dayBlock(day){
  const races=RS.filter(r=>r.date===day&&inFilter(r));
  const groups={};races.forEach(r=>{(groups[r.st.id]=groups[r.st.id]||[]).push(r)});
  // stevner uten detaljprogram som pågår
  const loose=STL.filter(s=>!s.races.length&&s.from<=day&&s.to>=day&&stInFilter(s)&&!(s.sp==='al'&&s.id==='al-sv'&&false));
  // Sun Valley har ingen løp lagt inn → vises som banner
  let ids=Object.keys(groups);
  ids.sort((a,b)=>{const ra=groups[a][0],rb=groups[b][0];return (ra.t||'99').localeCompare(rb.t||'99')});
  let html=ids.map(id=>stageCard(ST[id],groups[id],day)).join('');
  html+=loose.map(s=>stageCard(s,[],day)).join('');
  return {html,n:ids.length+loose.length};
}

const SER_ORDER=['Verdenscup','World Championship','Tour de Ski','Hoppuka','Grand Classics','VM','EM','NM','Sesongåpning'];
const SER_DESC={'Verdenscup':'Hele verdenscupsesongen','World Championship':'Ski Classics sin sammenlagtserie','Tour de Ski':'Etapperennet i romjula og over nyttår','Hoppuka':'Fire bakker i Tyskland og Østerrike','Grand Classics':'De fire største langløpene','VM':'Verdensmesterskapet','EM':'Europamesterskapet','NM':'Norgesmesterskapet','Sesongåpning':'Nasjonale renn før verdenscupen'};
const STAND={lr:'https://www.fis-ski.com/DB/cross-country/cup-standings.html',al:'https://www.fis-ski.com/DB/alpine-skiing/cup-standings.html',hp:'https://www.fis-ski.com/DB/ski-jumping/cup-standings.html',kb:'https://www.fis-ski.com/DB/nordic-combined/cup-standings.html',ss:'https://www.biathlonresults.com',sc:'https://skiclassics.com'};
function seriesOf(s){
  if(s.tag==='VM')return['VM'];if(s.tag==='EM')return['EM'];if(s.tag==='NM')return['NM'];
  if(s.note.startsWith('Nasjonale'))return['Sesongåpning'];
  if(s.sp==='sc')return s.tag==='Grand Classics'?['World Championship','Grand Classics']:['World Championship'];
  const o=['Verdenscup'];if(s.tag==='Tour de Ski')o.push('Tour de Ski');if(s.tag==='Hoppuka')o.push('Hoppuka');return o;

const gOk=r=>r.g===(S.ig||'K')||r.g==='B'||r.g==='X';
const gRaces=s=>s.races.filter(gOk);
const gStage=s=>!s.races.length||gRaces(s).length>0;
const gSeg=()=>`<div class="seg wide gseg" id="gSeg"><button data-g="K" class="${(S.ig||'K')==='K'?'on':''}">Kvinner</button><button data-g="M" class="${S.ig==='M'?'on':''}">Menn</button></div>`;
function seriesList(sp){const m={};STL.filter(s=>s.sp===sp&&gStage(s)).forEach(s=>seriesOf(s).forEach(n=>(m[n]=m[n]||[]).push(s)));return SER_ORDER.filter(n=>m[n]).map(n=>({n,st:m[n]}))}
const uniq=a=>[...new Set(a)];
function chOf(stages){return uniq(stages.flatMap(s=>s.ch.split(' / '))).filter(c=>c!=='?')}
function progress(races){const d=races.filter(r=>status(r).k==='done').length;return{d,n:races.length,p:races.length?Math.round(d/races.length*100):0}}
function pbar(p){return `<div class="pbar"><i style="width:${p.p}%"></i></div><div class="ptxt">${p.n?`${p.d} av ${p.n} øvelser gjennomført`:'Program ikke lagt inn'}</div>`}
function backBar(label,to){return `<div class="backbar"><button class="back" data-back="${to}">‹ ${label}</button></div>`}
function idretter(){
  const m=$('main');

    m.innerHTML=`<div class="hint">Velg en idrett for å se verdenscup, mesterskap og touren samlet.</div><div class="sgrid">`+Object.entries(SPORT).map(([k,v])=>{

  }else if(!S.ser){

      <div class="sermeta">${range(from,to)} · ${x.st.length} ${x.st.length===1?'arrangement':'arrangementer'}</div>
      <div class="serch">${chOf(x.st).map(tvB).join('')}</div>${pbar(p)}</button>`}).join('');
  }else{
    const sp=S.isp,x=seriesList(sp).find(y=>y.n===S.ser);if(!x){S.ser=null;return idretter()}
    const tab=S.sertab||'program';const ra=x.st.flatMap(gRaces).sort((a,b)=>(a.date+(a.t||'99')).localeCompare(b.date+(b.t||'99')));
    let html=backBar(SPORT[sp].n,'sport')+`<div class="shead">${badge(sp)}<div><h2>${x.n}</h2><div class="meta" style="margin:0">${SPORT[sp].n} · ${x.st.length} ${x.st.length===1?'arrangement':'arrangementer'}</div></div></div>
    ${gSeg()}<div class="seg wide" id="serSeg"><button data-t="program" class="${tab==='program'?'on':''}">Program</button><button data-t="sammenlagt" class="${tab==='sammenlagt'?'on':''}">Sammenlagt</button></div>`;

        html+=up.length?byDay(up):`<div class="card"><div class="banner">Alle øvelser er gjennomført.</div></div>`;
        if(done.length)html+=`<details class="donebox"><summary>Gjennomført (${done.length})</summary>${byDay(done.reverse())}</details>`;
        const noProg=x.st.filter(s=>!s.races.length);if(noProg.length)html+=`<div class="sec">Program kommer</div><div class="card">${noProg.map(stageRow).join('')}</div>`;

      <div><a class="btn" href="${STAND[sp]}" target="_blank" rel="noopener">Se offisiell stilling ↗</a></div></div>

  m.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{if(b.dataset.back==='top'){S.isp=null}S.ser=null;window.scrollTo(0,0);idretter()});

function bindMain(){
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRace(RS.find(r=>r.id===b.dataset.r)));
  document.querySelectorAll('[data-s]').forEach(b=>{if(!b.classList.contains('chip'))b.onclick=()=>openStage(ST[b.dataset.s])});
  document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav);render()});
  const j=$('jump');if(j)j.onclick=()=>{S.date=j.dataset.d;render()};
}
function toggleFav(id){S.fav.st=S.fav.st.includes(id)?S.fav.st.filter(x=>x!==id):[...S.fav.st,id];save()}

/* ================= ARK ================= */
function openSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('sheetbg').style.display='block';requestAnimationFrame(()=>$('sheet').classList.add('open'));bindSheet()}
function closeSheet(){$('sheet').classList.remove('open');$('sheetbg').style.display='none'}
$('sheetbg').onclick=closeSheet;
function bindSheet(){
  const sh=$('sheet');
  sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRace(RS.find(r=>r.id===b.dataset.r)));
  sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openStage(ST[b.dataset.s]));
  sh.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{toggleFav(b.dataset.fav);b.classList.toggle('on');b.textContent=b.classList.contains('on')?'★ Følger':'☆ Følg';render()});
}
function openRace(r,tab){
  const s=r.st,st=status(r);
  const c=r.ch,ch=CH[c];
  tab=r.sl?(tab||S.rtab||'info'):'info';S.rtab=tab;
  const tabs=r.sl?`<div class="seg wide" id="rTab"><button data-t="info" class="${tab==='info'?'on':''}">Info</button><button data-t="sl" class="${tab==='sl'?'on':''}">Startliste (${r.sl.rows.length})</button></div>`:'';
  if(tab==='sl'){openSheet(`<h2>${r.d}</h2><div class="meta">${flag(s.cc)} ${s.v} · ${G[r.g]} · ${fmtShort(r.date)}</div>${tabs}<div id="slBox"></div>`);bindRTab(r);renderSL(r);return}
  openSheet(`<h2>${r.d}</h2><div class="meta">${SPORT[r.sp].n} · ${G[r.g]}${s.tag?' · '+s.tag:''}</div>${tabs}
  <dl class="kv">
    <dt>Dato</dt><dd>${fmtDay(r.date)}</dd>
    <dt>Sendestart</dt><dd>${r.tv?r.tv+' (norsk tid)':'<span style="font-weight:500;color:var(--mut)">Ikke publisert ennå</span>'}</dd>
    <dt>Start øvelse</dt><dd>${r.t?r.t+' (norsk tid)':'Ikke oppgitt'}${st.k==='soon'&&st.m<1440?' · '+countdown(st.m):''}${st.k==='live'?' · <span style="color:var(--live)">pågår</span>':''}</dd>
    <dt>Sted</dt><dd>${flag(s.cc)} ${s.v}${cn(s.cc)?', '+cn(s.cc):''}</dd>
    <dt>Sendes på</dt><dd>${c==='?'?'Ikke oppgitt':(ch?ch.d:c)}${r.radio?'<br><span style="font-weight:500;color:var(--mut)">Radio: NRK Sport</span>':''}</dd>
  </dl>
  ${s.note?`<div class="note">${s.note}</div>`:''}

  <div class="actions">
    ${ch?`<a class="btn" href="${ch.u}" target="_blank" rel="noopener">Se på ${c} ↗</a>`:''}
    <button class="btn ghost" id="icsOne">Legg i kalender</button>
    <a class="btn ghost" href="${SPORT[r.sp].res}" target="_blank" rel="noopener">Resultater ↗</a>
  </div>
  <div class="sec">Arrangement</div><div class="card">${stageRow(s).replace('class="star','style="display:none" class="star')}</div>`);
  $('icsOne').onclick=()=>downloadICS([r],'renn.ics');
  bindRTab(r);
}
function bindRTab(r){const t=$('rTab');if(t)t.querySelectorAll('button').forEach(b=>b.onclick=()=>{openRace(r,b.dataset.t);$('sheet').scrollTop=0})}
let SLV={sort:'start',top:10,q:''};
try{const v=JSON.parse(localStorage.getItem('vp-sl')||'null');if(v)SLV.top=v.top??10}catch(e){}
function renderSL(r){
  const box=$('slBox');if(!box)return;
  const rows=r.sl.rows;
  const ranked=rows.filter(x=>x[5]!=null).slice().sort((a,b)=>a[5]-b[5]);
  const rank={};ranked.forEach((x,i)=>rank[x[0]]=i+1);
  const now=new Date(),isToday=r.date===TODAY;
  const startD=x=>{const d=parse(r.date);const[hh,mm,ss]=x[1].split(':').map(Number);d.setHours(hh,mm,ss||0);return d};
  let next=null;if(isToday){const n=rows.find(x=>startD(x)>now);next=n?n[0]:null}
  const q=norm(SLV.q||'');
  let list=SLV.sort==='fis'?[...ranked,...rows.filter(x=>x[5]==null)]:rows.slice();
  if(q)list=list.filter(x=>norm(x[2]+' '+x[3]+' '+x[4]+' '+x[0]).includes(q));
  const top=SLV.top;
  box.innerHTML=`<div class="slctl">
    <div class="seg" id="slSort"><button data-s="start" class="${SLV.sort==='start'?'on':''}">Startrekkefølge</button><button data-s="fis" class="${SLV.sort==='fis'?'on':''}">FIS-poeng</button></div>
    <select class="sel" id="slTop">${[0,5,10,15,20].map(n=>`<option value="${n}" ${n===top?'selected':''}>${n?'Fremhev topp '+n:'Ingen utheving'}</option>`).join('')}</select>
  </div>
  <div class="search sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="slQ" type="search" placeholder="Finn løper, nasjon eller klubb" value="${(SLV.q||'').replace(/"/g,'&quot;')}"></div>
  ${top?`<div class="hint">De ${top} med lavest FIS-poeng er uthevet. Lavere poeng betyr sterkere løper.</div>`:''}
  <div class="card sl">${list.length?list.map(x=>{
    const rk=rank[x[0]],hi=top&&rk&&rk<=top,out=isToday&&startD(x)<=now;
    return `<div class="slr${hi?' top':''}${out?' out':''}">
      <span class="bib">${x[0]}</span>
      <span class="st">${x[1]}${x[0]===next?'<em>Neste</em>':''}</span>
      <span class="nm"><b>${hi?`<i class="rk">#${rk}</i>`:''}${x[2]}</b><small>${x[4]}</small></span>
      <span class="nat">${flag(x[3])}<small>${x[3]}</small></span>
      <span class="fis">${x[5]==null?'–':x[5].toFixed(2).replace('.',',')}</span></div>`}).join(''):'<div class="banner">Ingen treff.</div>'}</div>
  <div class="small">Kilde: <a href="${r.sl.url}" target="_blank" rel="noopener">${r.sl.src}</a>. Starttider er norsk tid.</div>`;
  box.querySelectorAll('#slSort button').forEach(b=>b.onclick=()=>{SLV.sort=b.dataset.s;renderSL(r)});
  $('slTop').onchange=e=>{SLV.top=+e.target.value;try{localStorage.setItem('vp-sl',JSON.stringify({top:SLV.top}))}catch(_){}renderSL(r)};
  const qi=$('slQ');qi.oninput=()=>{SLV.q=qi.value;const pos=qi.selectionStart;renderSL(r);const n=$('slQ');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}};
}
function openStage(s){
  const on=S.fav.st.includes(s.id);
  const byDay={};s.races.forEach(r=>(byDay[r.date]=byDay[r.date]||[]).push(r));
  let body=Object.keys(byDay).sort().map(d=>`<div class="sec">${fmtDay(d)}</div><div class="card">${byDay[d].sort((a,b)=>(a.t||'99').localeCompare(b.t||'99')).map(r=>raceRow(r)).join('')}</div>`).join('');
  if(!body)body=`<div class="card" style="margin-top:14px"><div class="banner">Detaljert program er ikke lagt inn ennå.</div></div>`;
  openSheet(`<div style="display:flex;gap:12px;align-items:center">${badge(s.sp)}<div style="flex:1"><h2>${flag(s.cc)} ${s.v}</h2><div class="meta" style="margin:0">${[SPORT[s.sp].n,cn(s.cc),range(s.from,s.to)].filter(Boolean).join(' · ')}</div></div></div>
  <div class="actions" style="margin-top:10px">${tvB(s.ch)}${s.tag?tagH(s.tag):''}</div>
  ${s.note?`<div class="note">${s.note}</div>`:''}
  <div class="actions"><button class="btn ${on?'':'ghost'} star ${on?'on':''}" data-fav="${s.id}" style="font-size:14px;color:inherit">${on?'★ Følger':'☆ Følg'}</button>
  ${s.races.length?'<button class="btn ghost" id="icsSt">Legg alt i kalender</button>':''}</div>
  ${body}`);
  const b=$('icsSt');if(b)b.onclick=()=>downloadICS(s.races,s.v.replace(/\W+/g,'-').toLowerCase()+'.ics');
}

/* ================= ICS ================= */
function downloadICS(list,name){
  const z=n=>String(n).padStart(2,'0');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SnowTime//NO','CALSCALE:GREGORIAN'];
  list.forEach(r=>{
    const d=r.date.replace(/-/g,'');
    out.push('BEGIN:VEVENT','UID:'+r.id+'-'+d+'@snowtime','DTSTAMP:'+stamp);
    if(r.t){const[h,m]=r.t.split(':').map(Number);const e=new Date(start(r).getTime()+90*60000);
      out.push(`DTSTART;TZID=Europe/Oslo:${d}T${z(h)}${z(m)}00`,`DTEND;TZID=Europe/Oslo:${e.getFullYear()}${z(e.getMonth()+1)}${z(e.getDate())}T${z(e.getHours())}${z(e.getMinutes())}00`);}
    else{const n=parse(r.date);n.setDate(n.getDate()+1);out.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+toISO(n).replace(/-/g,''))}
    out.push('SUMMARY:'+SPORT[r.sp].n+': '+r.d+' ('+G[r.g]+') – '+r.st.v,'LOCATION:'+r.st.v+', '+cn(r.st.cc),'DESCRIPTION:Sendes på '+(r.ch==='?'?'ukjent kanal':r.ch)+(r.t?'':'. Starttid ikke publisert.'),'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  const text=out.join('\r\n');
  saveFile(name,text);
}
let DL=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function saveFile(name,text){
  if(DL){try{await DL.save({filename:name,data:text});return}catch(e){if(e&&/declin|cancel|abort/i.test(String(e.code||e.message||'')))return}}
  const blob=new Blob([text],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.v));
  $('todayBtn').style.visibility=S.v==='program'?'visible':'hidden';
  header();
  ({program,steder,idretter,folger,sok})[S.v]();
}
document.querySelectorAll('nav.bottom button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='idretter'&&S.v==='idretter'){S.isp=null;S.ser=null}S.v=b.dataset.v;window.scrollTo(0,0);render()});
$('todayBtn').onclick=()=>{S.date=clampDate(TODAY);S.mode='dag';render()};
$('infoBtn').onclick=info;
$('searchBtn').onclick=()=>{if(S.v!=='sok'){S.prev=S.v;S.v='sok';window.scrollTo(0,0);render()}};

/* ================= SVEIP MELLOM DAGER ================= */
function shiftDay(dir){
  const d=parse(S.date);d.setDate(d.getDate()+(S.mode==='uke'?7:1)*dir);
  const n=clampDate(toISO(d));if(n===S.date)return;
  S.date=n;render();window.scrollTo(0,0);
  const m=$('main');m.classList.remove('sl','sr');void m.offsetWidth;m.classList.add(dir>0?'sl':'sr');
}
(function(){
  let x0=null,y0=0,t0=0;const m=$('main');
  m.addEventListener('touchstart',e=>{
    x0=null;
    if(S.v!=='program'||$('sheet').classList.contains('open')||e.touches.length>1)return;
    if(e.target.closest('.next,.chips,.days'))return;
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();
  },{passive:true});
  m.addEventListener('touchend',e=>{
    if(x0===null)return;const t=e.changedTouches[0];const dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-t0>900)return;
    shiftDay(dx<0?1:-1);
  },{passive:true});
  document.addEventListener('keydown',e=>{
    if(S.v!=='program'||$('sheet').classList.contains('open')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
    if(e.key==='ArrowRight')shiftDay(1);else if(e.key==='ArrowLeft')shiftDay(-1);
  });
})();
render();
setInterval(()=>{if(S.v==='program'&&!$('sheet').classList.contains('open'))program()},60000);
