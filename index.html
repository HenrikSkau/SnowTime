const pad=n=>String(n).padStart(2,'0');

const fmtShort=s=>parse(s).toLocaleDateString('nb-NO',{day:'numeric',month:'short'}).replace('.','');
const range=(a,b)=>a===b?fmtShort(a):(a.slice(5,7)===b.slice(5,7)?parse(a).getDate()+'.–'+fmtShort(b):fmtShort(a)+' – '+fmtShort(b));

const start=r=>{const d=parse(r.date);if(r.t){const[h,m]=r.t.split(':');d.setHours(+h,+m)}return d};
function status(r){
  const now=new Date();
  if(r.date<TODAY)return{k:'done'};
  if(r.date>TODAY)return{k:'up'};
  if(!r.t)return{k:'today'};
  const diff=(start(r)-now)/60000;
  if(diff>0)return{k:'soon',m:diff};
  if(diff>-100)return{k:'live'};
  return{k:'done'};
}
const inFilter=r=>(S.sp==='all'||r.sp===S.sp)&&(S.g==='all'||r.g===S.g||r.g==='B'||r.g==='X')&&(S.ch==='all'||r.ch.includes(S.ch));
const stInFilter=s=>(S.sp==='all'||s.sp===S.sp)&&(S.ch==='all'||s.ch.includes(S.ch));
const countdown=m=>m<60?`om ${Math.round(m)} min`:m<60*24?`om ${Math.floor(m/60)} t ${Math.round(m%60)} min`:'';

/* ================= SØK ================= */
// Søkeindeksen er bygget som en liste med typer, slik at nye typer (f.eks. utøvere) kan legges til senere.
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/æ/g,'ae').replace(/ø/g,'o');
const ALIAS={'VM':'vm verdensmesterskap mesterskap','EM':'em europamesterskap mesterskap','NM':'nm norgesmesterskap mesterskap','Tour de Ski':'tour de ski tds','Hoppuka':'hoppuka four hills','Finale':'finale verdenscupfinale grand finale','Grand Classics':'grand classics','Skiflyging':'skiflyging','Sesongstart':'sesongstart','Sesongåpning':'sesongapning sesongstart'};
function stageHay(s){
  const wc=s.sp==='sc'?'ski classics world championship langlop langrenn':['VM','EM','NM'].includes(s.tag)||s.note.startsWith('Nasjonale')?'':'verdenscup world cup';
  const mo=parse(s.from).toLocaleDateString('nb-NO',{month:'long'});
  return norm([s.v,cn(s.cc),SPORT[s.sp].n,s.tag,ALIAS[s.tag]||'',wc,s.ch,mo,s.sp==='hp'&&s.tag!=='VM'?'hopp':'',s.sp==='lr'?'ski':'',s.sp==='kb'?'kombinert nordisk':''].join(' '));
}
const INDEX={
  stages:STL.map(s=>({type:'stage',item:s,hay:stageHay(s)})),
  races:RS.map(r=>({type:'race',item:r,hay:stageHay(r.st)+' '+norm(r.d+' '+G[r.g]),own:norm(r.d)})),
  athletes:[] // fylles inn når utøverdata legges til
};
function search(q){
  const t=norm(q).split(/\s+/).filter(Boolean);
  if(!t.length)return null;
  const all=x=>t.every(w=>x.hay.includes(w));
  const st=INDEX.stages.filter(all).map(x=>x.item);
  const ra=INDEX.races.filter(x=>all(x)&&t.some(w=>x.own.includes(w))).map(x=>x.item);
  const up=ra.filter(r=>r.date>=TODAY),past=ra.filter(r=>r.date<TODAY);
  return {t,st,ra:[...up,...past].slice(0,40),nra:ra.length,ath:INDEX.athletes.filter(all)};
}
function hl(text,t){let s=text;t.forEach(w=>{if(w.length<2)return;const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');s=s.replace(re,'<mark>$1</mark>')});return s}
function sok(){
  const res=search(S.q||'');const m=$('main');
  if(!res){
    const sug=['VM','Falun','Tour de Ski','Hoppuka','Holmenkollen','NM','Femmila','Skiflyging','Kitzbühel','Finale'];
    m.innerHTML=`<div class="hint">Søk etter arrangementer, steder, øvelser, grener eller kanaler. Prøv for eksempel:</div>
    <div class="chips" style="flex-wrap:wrap;padding:0 0 10px">${sug.map(x=>`<button class="chip" data-q="${x}">${x}</button>`).join('')}</div>
    <div class="card"><div class="banner">👤 Søk på utøvere kommer i en senere versjon.</div></div>`;
    m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.q=b.dataset.q;$('q').value=S.q;sok()});
    return;
  }
  let html='';
  if(res.st.length){
    const up=res.st.filter(s=>s.to>=TODAY),past=res.st.filter(s=>s.to<TODAY);
    html+=`<div class="sec" style="margin-top:2px">Arrangementer · ${res.st.length}</div><div class="card">${[...up,...past].map(s=>stageRow(s).replace(`<b>${flag(s.cc)} ${s.v}`,`<b>${flag(s.cc)} ${hl(s.v,res.t)}`)).join('')}</div>`;
  }
  if(res.ra.length){
    html+=`<div class="sec">Øvelser · ${res.nra}${res.nra>40?' (viser 40)':''}</div><div class="card">${res.ra.map(r=>raceRow(r,true).replace(`<b>${r.d}</b>`,`<b>${hl(r.d,res.t)}</b>`).replace(`<span>${fmtShort(r.date)} · ${SPORT[r.sp].n}</span>`,`<span>${fmtShort(r.date)} · ${r.st.v} · ${SPORT[r.sp].n}</span>`)).join('')}</div>`;
  }
  if(!html)html=`<div class="empty"><b>Ingen treff på «${S.q.replace(/</g,'&lt;')}»</b>Prøv et annet ord, for eksempel et stedsnavn eller «VM».</div>`;
  m.innerHTML=html;bindMain();
}

function raceRow(r,showDate){
  const st=status(r);let tm;
  if(st.k==='live')tm=`<span class="live">● PÅGÅR</span>`;
  else if(st.k==='done')tm=`<b>${r.t||'–'}</b><span>Ferdig</span>`;
  else tm=`<b>${r.t||'–'}</b><span>${st.k==='soon'?countdown(st.m):(r.t?'':'tid kommer')}</span>`;
  const when=showDate?`${fmtShort(r.date)} · `:'';
  return `<button class="row ${st.k==='done'?'done':''}" data-r="${r.id}">
    <div class="time">${tm}</div>
    <div class="d"><b>${r.d}</b>${gH(r.g)}<span>${when}${SPORT[r.sp].n}</span></div>
    <div style="text-align:right">${tvB(r.ch)}${r.radio?'<div class="radio">+ NRK radio</div>':''}</div></button>`;
}
function stageCard(s,races,dayISO){
  const head=`<button class="ch" data-s="${s.id}">${badge(s.sp)}<div class="t"><b>${flag(s.cc)} ${s.v}${tagH(s.tag)}</b><span>${[SPORT[s.sp].n,cn(s.cc),range(s.from,s.to)].filter(Boolean).join(' · ')}</span></div>${s.ch.includes('/')?'':tvB(s.ch)}</button>`;
  if(races.length)return `<div class="card">${head}${races.map(r=>raceRow(r)).join('')}</div>`;
  const wk=s.note.startsWith('Uke');
  return `<div class="card">${head}<div class="banner">${wk?'📅 Renn denne uka. Eksakte dager er ikke lagt inn.':s.tag==='VM'?'🏆 Mesterskapet pågår. Dagsprogrammet er ikke lagt inn ennå.':(s.sp==='sk'?'⛸️ Sendes på Viaplay. Sted og tider er ikke oppgitt.':'📅 Pågår. Detaljert program er ikke lagt inn.')}</div></div>`;
}
function dayBlock(day){
  const races=RS.filter(r=>r.date===day&&inFilter(r));
  const groups={};races.forEach(r=>{(groups[r.st.id]=groups[r.st.id]||[]).push(r)});
  // stevner uten detaljprogram som pågår
  const loose=STL.filter(s=>!s.races.length&&s.from<=day&&s.to>=day&&stInFilter(s)&&!(s.sp==='al'&&s.id==='al-sv'&&false));
  // Sun Valley har ingen løp lagt inn → vises som banner
  let ids=Object.keys(groups);
  ids.sort((a,b)=>{const ra=groups[a][0],rb=groups[b][0];return (ra.t||'99').localeCompare(rb.t||'99')});
  let html=ids.map(id=>stageCard(ST[id],groups[id],day)).join('');
  html+=loose.map(s=>stageCard(s,[],day)).join('');
  return {html,n:ids.length+loose.length};
}
function program(){
  const m=$('main');
  if(S.mode==='dag'){
    const b=dayBlock(S.date);
    let top='';
    if(S.date===TODAY){
      const nx=RS.filter(r=>inFilter(r)&&start(r)>new Date()&&r.t).slice(0,8);
      if(nx.length)top=`<div class="sec" style="margin-top:2px">Neste med starttid</div><div class="next">${nx.map(nxCard).join('')}</div>`;
    }
    m.innerHTML=top+`<div class="dayhead">${S.date===TODAY?'I dag · ':''}${fmtDay(S.date)}</div>`+(b.n?b.html:emptyDay(S.date));
  }else{
    const d=parse(S.date);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);
    let html='';let any=false;
    for(let i=0;i<7;i++){const s=toISO(d);const b=dayBlock(s);if(b.n){any=true;html+=`<div class="dayhead">${s===TODAY?'I dag · ':''}${fmtDay(s)}</div>`+b.html}d.setDate(d.getDate()+1)}
    m.innerHTML=any?html:emptyDay(S.date,true);
  }
  bindMain();
}
function nxCard(r){
  const st=status(r);const dd=r.date===TODAY?'I dag':fmtShort(r.date);
  return `<button class="nx" data-r="${r.id}"><div class="top2">${badge(r.sp)}<span class="loc">${flag(r.st.cc)} ${r.st.v}</span>${tvB(r.ch)}</div><b>${r.d} ${gH(r.g)}</b><div class="when">${dd} kl. ${r.t}${st.k==='soon'&&st.m<1440?' · '+countdown(st.m):''}</div></button>`;
}
function emptyDay(day,week){
  const nx=RS.find(r=>r.date>day&&inFilter(r));
  return `<div class="empty"><b>Ingen renn ${week?'denne uka':'denne dagen'}</b>${S.sp!=='all'||S.ch!=='all'||S.g!=='all'?'Prøv å fjerne filtrene.<br>':''}
  ${nx?`<button class="btn" id="jump" data-d="${nx.date}">Neste renn: ${fmtShort(nx.date)} →</button>`:''}</div>`;
}

function steder(){
  const list=STL.filter(s=>S.stSp==='all'||s.sp===S.stSp);
  let html='',cur='';let open=false;
  list.forEach(s=>{
    const mo=parse(s.from).toLocaleDateString('nb-NO',{month:'long',year:'numeric'});
    if(mo!==cur){if(open)html+='</div>';html+=`<div class="month">${mo}</div><div class="card">`;cur=mo;open=true}
    html+=stageRow(s);
  });
  if(open)html+='</div>';
  $('main').innerHTML=html;bindMain();
}
function stageRow(s){
  const on=S.fav.st.includes(s.id);
  return `<div class="stage ${s.to<TODAY?'past':''}"><button class="open" data-s="${s.id}">${badge(s.sp)}<div class="t"><b>${flag(s.cc)} ${s.v}${tagH(s.tag)}</b><span>${range(s.from,s.to)} · ${s.races.length?s.races.length+(s.races.length===1?' øvelse':' øvelser'):'program kommer'}</span></div>${tvB(s.ch)}</button>
  <button class="star ${on?'on':''}" data-fav="${s.id}" aria-label="Følg">${on?'★':'☆'}</button></div>`;
}

function tv(){
  const chs=['NRK','TV 2','Viaplay','SC Play'];
  let html=`<div class="small" style="padding-top:2px">Hvem sender hva i vinter. Trykk på en kanal for å se de neste sendingene.</div>`;
  const rights={'NRK':['Skiskyting (deler med TV 2)','Alpint, langrenn, hopp og kombinert på norsk jord','Alpint-VM i Crans-Montana','NM på ski, i hopp, skiskyting og alpint','Radiokanalen NRK Sport: alle renn i langrenn og skiskyting, Hoppuka og VM i hopp og kombinert'],
    'TV 2':['Skiskyting (deler med NRK)','Verdenscup utenfor Norge (deler med Viaplay)','Ski-VM i Falun, hele mesterskapet'],
    'Viaplay':['Verdenscup utenfor Norge (deler med TV 2): langrenn, alpint, hopp og kombinert','Alt av skøyter'],
    'SC Play':['Alle renn i Ski Classics World Championship, med engelsk kommentar','NRK sendte Ski Classics forrige sesong. Ikke bekreftet for 2026/27']};
  chs.forEach(c=>{
    const up=RS.filter(r=>r.ch.includes(c)&&r.date>=TODAY).slice(0,6);
    const nst=STL.filter(s=>s.ch.includes(c)).length;
    html+=`<div class="card"><div class="ch" style="cursor:default">${tvB(c)}<div class="t"><b>${CH[c].d}</b><span>${nst} arrangementer i sesongen</span></div><a class="tv" href="${CH[c].u}" target="_blank" rel="noopener">Åpne ↗</a></div>
    <div class="banner" style="display:block">${rights[c].map(x=>'• '+x).join('<br>')}</div>
    ${up.map(r=>raceRow(r,true)).join('')}
    <button class="row" data-chf="${c}" style="justify-content:center;color:var(--acc);font-weight:600">Vis alt på ${c} i programmet →</button></div>`;
  });
  $('main').innerHTML=html;bindMain();
  document.querySelectorAll('[data-chf]').forEach(b=>b.onclick=()=>{S.ch=b.dataset.chf;S.v='program';S.mode='uke';save();render()});
}

function folger(){
  const fs=S.fav.sp,fst=S.fav.st;
  let html=`<div class="sec" style="margin-top:2px">Grener du følger</div><div class="chips" style="padding:0 0 4px;flex-wrap:wrap">`+
    Object.entries(SPORT).map(([k,v])=>`<button class="chip ${fs.includes(k)?'on':''}" data-fsp="${k}"><span class="sw" style="background:${v.c}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg></span>${v.n}</button>`).join('')+`</div>`;
  const mine=RS.filter(r=>r.date>=TODAY&&(fs.includes(r.sp)||fst.includes(r.st.id))&&status(r).k!=='done');
  html+=`<div class="sec">Neste for deg</div>`;
  if(!fs.length&&!fst.length)html+=`<div class="card"><div class="banner">Velg grener over, eller trykk ☆ på et arrangement under «Arrangementer», så samler vi de neste rennene dine her.</div></div>`;
  else if(!mine.length)html+=`<div class="card"><div class="banner">Ingen kommende renn.</div></div>`;
  else html+=`<div class="card">${mine.slice(0,20).map(r=>raceRow(r,true)).join('')}</div>`;
  if(fst.length){html+=`<div class="sec">Arrangementer du følger</div><div class="card">${fst.map(id=>ST[id]).filter(Boolean).sort((a,b)=>a.from.localeCompare(b.from)).map(stageRow).join('')}</div>`}
  html+=`<div class="sec">Legg i kalenderen</div><div class="card"><div class="banner" style="display:block">Last ned alle rennene du følger som en kalenderfil (.ics) for Google, Apple eller Outlook.
  <div><button class="btn" id="icsAll" ${mine.length?'':'disabled style="opacity:.4"'}>Last ned ${mine.length} renn</button></div></div></div>`;
  $('main').innerHTML=html;bindMain();
  document.querySelectorAll('[data-fsp]').forEach(b=>b.onclick=()=>{const k=b.dataset.fsp;S.fav.sp=fs.includes(k)?fs.filter(x=>x!==k):[...fs,k];save();render()});
  const ia=$('icsAll');if(ia&&mine.length)ia.onclick=()=>downloadICS(mine,'mine-renn.ics');
}

function bindMain(){
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRace(RS.find(r=>r.id===b.dataset.r)));
  document.querySelectorAll('[data-s]').forEach(b=>{if(!b.classList.contains('chip'))b.onclick=()=>openStage(ST[b.dataset.s])});
  document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav);render()});
  const j=$('jump');if(j)j.onclick=()=>{S.date=j.dataset.d;render()};
}
function toggleFav(id){S.fav.st=S.fav.st.includes(id)?S.fav.st.filter(x=>x!==id):[...S.fav.st,id];save()}

/* ================= ARK ================= */
function openSheet(html){$('sheet').innerHTML='<div class="grab"></div>'+html;$('sheetbg').style.display='block';requestAnimationFrame(()=>$('sheet').classList.add('open'));bindSheet()}
function closeSheet(){$('sheet').classList.remove('open');$('sheetbg').style.display='none'}
$('sheetbg').onclick=closeSheet;
function bindSheet(){
  const sh=$('sheet');
  sh.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>openRace(RS.find(r=>r.id===b.dataset.r)));
  sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>openStage(ST[b.dataset.s]));
  sh.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{toggleFav(b.dataset.fav);b.classList.toggle('on');b.textContent=b.classList.contains('on')?'★ Følger':'☆ Følg';render()});
}
function openRace(r){
  const s=r.st,st=status(r);
  const c=r.ch,ch=CH[c];
  openSheet(`<h2>${r.d}</h2><div class="meta">${SPORT[r.sp].n} · ${G[r.g]}${s.tag?' · '+s.tag:''}</div>
  <dl class="kv">
    <dt>Dato</dt><dd style="text-transform:capitalize">${fmtDay(r.date)}</dd>
    <dt>Start</dt><dd>${r.t?r.t+' (norsk tid)':'Ikke oppgitt'}${st.k==='soon'&&st.m<1440?' · '+countdown(st.m):''}${st.k==='live'?' · <span style="color:var(--live)">pågår</span>':''}</dd>
    <dt>Sted</dt><dd>${flag(s.cc)} ${s.v}${cn(s.cc)?', '+cn(s.cc):''}</dd>
    <dt>Sendes på</dt><dd>${c==='?'?'Ikke oppgitt':(ch?ch.d:c)}${r.radio?'<br><span style="font-weight:500;color:var(--mut)">Radio: NRK Sport</span>':''}</dd>
  </dl>
  ${s.note?`<div class="note">${s.note}</div>`:''}

  <div class="actions">
    ${ch?`<a class="btn" href="${ch.u}" target="_blank" rel="noopener">Se på ${c} ↗</a>`:''}
    <button class="btn ghost" id="icsOne">Legg i kalender</button>
    <a class="btn ghost" href="${SPORT[r.sp].res}" target="_blank" rel="noopener">Resultater ↗</a>
  </div>
  <div class="sec">Arrangement</div><div class="card">${stageRow(s).replace('class="star','style="display:none" class="star')}</div>`);
  $('icsOne').onclick=()=>downloadICS([r],'renn.ics');
}
function openStage(s){
  const on=S.fav.st.includes(s.id);
  const byDay={};s.races.forEach(r=>(byDay[r.date]=byDay[r.date]||[]).push(r));
  let body=Object.keys(byDay).sort().map(d=>`<div class="sec" style="text-transform:capitalize">${fmtDay(d)}</div><div class="card">${byDay[d].sort((a,b)=>(a.t||'99').localeCompare(b.t||'99')).map(r=>raceRow(r)).join('')}</div>`).join('');
  if(!body)body=`<div class="card" style="margin-top:14px"><div class="banner">Detaljert program er ikke lagt inn ennå.</div></div>`;
  openSheet(`<div style="display:flex;gap:12px;align-items:center">${badge(s.sp)}<div style="flex:1"><h2>${flag(s.cc)} ${s.v}</h2><div class="meta" style="margin:0">${[SPORT[s.sp].n,cn(s.cc),range(s.from,s.to)].filter(Boolean).join(' · ')}</div></div></div>
  <div class="actions" style="margin-top:10px">${tvB(s.ch)}${s.tag?tagH(s.tag):''}</div>
  ${s.note?`<div class="note">${s.note}</div>`:''}
  <div class="actions"><button class="btn ${on?'':'ghost'} star ${on?'on':''}" data-fav="${s.id}" style="font-size:14px;color:inherit">${on?'★ Følger':'☆ Følg'}</button>
  ${s.races.length?'<button class="btn ghost" id="icsSt">Legg alt i kalender</button>':''}</div>
  ${body}`);
  const b=$('icsSt');if(b)b.onclick=()=>downloadICS(s.races,s.v.replace(/\W+/g,'-').toLowerCase()+'.ics');
}
function info(){
  openSheet(`<h2>Om Snowtime</h2><div class="meta">Terminliste og TV-oversikt for sesongen 2026/27</div>
  <div class="card"><div class="banner" style="display:block;line-height:1.55">

  <b style="color:var(--txt)">Tider og kanaler:</b> Hentet fra NRKs fulle sendeoversikt for vintersport 2026/27 (oppdatert 4. november). Alle tider er norsk tid og gjelder sendestart.<br><br>
  <b style="color:var(--txt)">Forbehold:</b> Programmet kan endres. Sjekk alltid kanalens egen TV-guide.
  </div></div>
  <div class="small">Kilde: <a href="https://www.nrk.no/sport/program-for-vintersport-i-2026_2027_-full-oversikt-over-langrenn_-skiskyting_-alpint_-skoyter_-hopp-1.18033873" target="_blank" rel="noopener">NRK Sport: Program for vintersport i 2026/2027</a>. Supplert med FIS- og IBU-kalendere for sted og øvelse. Langløp: <a href="https://skiclassics.com/events/" target="_blank" rel="noopener">skiclassics.com/events</a>.</div>`);
}

/* ================= ICS ================= */
function downloadICS(list,name){
  const z=n=>String(n).padStart(2,'0');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Snowtime//NO','CALSCALE:GREGORIAN'];
  list.forEach(r=>{
    const d=r.date.replace(/-/g,'');
    out.push('BEGIN:VEVENT','UID:'+r.id+'-'+d+'@snowtime','DTSTAMP:'+stamp);
    if(r.t){const[h,m]=r.t.split(':').map(Number);const e=new Date(start(r).getTime()+90*60000);
      out.push(`DTSTART;TZID=Europe/Oslo:${d}T${z(h)}${z(m)}00`,`DTEND;TZID=Europe/Oslo:${e.getFullYear()}${z(e.getMonth()+1)}${z(e.getDate())}T${z(e.getHours())}${z(e.getMinutes())}00`);}
    else{const n=parse(r.date);n.setDate(n.getDate()+1);out.push('DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+toISO(n).replace(/-/g,''))}
    out.push('SUMMARY:'+SPORT[r.sp].n+': '+r.d+' ('+G[r.g]+') – '+r.st.v,'LOCATION:'+r.st.v+', '+cn(r.st.cc),'DESCRIPTION:Sendes på '+(r.ch==='?'?'ukjent kanal':r.ch)+(r.t?'':'. Starttid ikke publisert.'),'END:VEVENT');
  });
  out.push('END:VCALENDAR');
  const text=out.join('\r\n');
  saveFile(name,text);
}
let DL=null;
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function saveFile(name,text){
  if(DL){try{await DL.save({filename:name,data:text});return}catch(e){if(e&&/declin|cancel|abort/i.test(String(e.code||e.message||'')))return}}
  const blob=new Blob([text],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.v));
  $('todayBtn').style.visibility=S.v==='program'?'visible':'hidden';
  header();
  ({program,steder,tv,folger,sok})[S.v]();
}
document.querySelectorAll('nav.bottom button').forEach(b=>b.onclick=()=>{S.v=b.dataset.v;window.scrollTo(0,0);render()});
$('todayBtn').onclick=()=>{S.date=clampDate(TODAY);S.mode='dag';render()};
$('infoBtn').onclick=info;
$('searchBtn').onclick=()=>{if(S.v!=='sok'){S.prev=S.v;S.v='sok';window.scrollTo(0,0);render()}};
render();
setInterval(()=>{if(S.v==='program'&&!$('sheet').classList.contains('open'))program()},60000);
